name: SDK contract and packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build
      - run: python -m unittest discover -s tests_sdk -v
      - run: node --test clients/typescript/test.mjs
      - run: python scripts/build-sdk-openapi.py && git diff --exit-code api/navigation.openapi.json
      - run: python -m build --wheel
      - run: cd clients/typescript && npm pack --ignore-scripts --pack-destination ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-python-${{ matrix.python }}
          path: dist/*
