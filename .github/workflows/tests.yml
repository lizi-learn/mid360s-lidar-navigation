name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-demo:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/audio_feedback/check.py --output /tmp/navigation-audio-feedback.json
      - run: python experiments/reception/check.py --output /tmp/reception-workflow.json
      - run: python experiments/reception/check_voice.py --output /tmp/reception-voice.json
      - run: python experiments/reception/check_ui.py
      - run: python -m compileall -q robot_profile.py nav_server.py nav_geometry.py survey.py localization_health.py demo_server.py sensor_watchdog.py scripts tests navigation
      - run: python -m compileall -q experiments
      - run: bash -n experiments/continuous_forward/build.sh experiments/continuous_forward/check_collision.sh experiments/gait_space/build.sh experiments/gait_space/check.sh
      - run: bash -n run-stack.sh scripts/build-deps.sh scripts/build-nav-controller.sh navigation/run.sh navigation/console.sh
      - run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic tests/velocity_contract_test.cpp -o /tmp/velocity-contract-test && /tmp/velocity-contract-test
      - run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic tests/terminal_heading_test.cpp -o /tmp/terminal-heading-test && /tmp/terminal-heading-test
  humble-controller:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ros-humble-nav2-smac-planner ros-humble-nav2-regulated-pure-pursuit-controller ros-humble-nav2-collision-monitor ros-humble-nav2-controller python3-numpy python3-scipy python3-colcon-common-extensions patch ros-humble-nav2-lifecycle-manager ros-humble-nav2-amcl ros-humble-nav2-map-server ros-humble-nav2-planner ros-humble-nav2-behaviors ros-humble-nav2-bt-navigator ros-humble-nav2-velocity-smoother ros-humble-slam-toolbox ros-humble-rmw-cyclonedds-cpp
      - run: bash scripts/build-nav-controller.sh
      - name: Consume passed route references and retain the precise final goal
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cmake -S experiments/waypoint_progress -B /tmp/waypoint-progress-build
          cmake --build /tmp/waypoint-progress-build -j2
          ROS_DOMAIN_ID=223 ROS_LOCALHOST_ONLY=1 /tmp/waypoint-progress-build/waypoint_progress
      - name: Reject swept-body collisions while allowing a clear forward left arc
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '230'
          ROS_LOG_DIR: /tmp/directional-stop-ros-logs
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          python3 experiments/check_directional_stop.py --binary "$GITHUB_WORKSPACE/nav_controller_ws/install/p2_nav_controller/lib/p2_nav_controller/observed_collision_monitor" --output /tmp/directional-stop-component.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-stop-component-evidence
          path: /tmp/directional-stop-component*
          if-no-files-found: ignore
      - name: Check bends, a clear obstacle pivot and a fully blocked stop
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '229'
          ROS_LOG_DIR: /tmp/forward-arc-ros-logs
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          python3 experiments/check_forward_arcs.py --output /tmp/forward-arc-component.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forward-arc-component-evidence
          path: /tmp/forward-arc-component*
          if-no-files-found: ignore
      - name: Compare delayed heading tracking with the actual RPP plugin
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '231'
          ROS_LOG_DIR: /tmp/heading-preview-ros-logs
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          cmake -S experiments/heading_preview -B /tmp/heading-preview-build
          cmake --build /tmp/heading-preview-build -j2
          python3 experiments/heading_preview/check.py --binary /tmp/heading-preview-build/heading_preview --output /tmp/heading-preview/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heading-preview-component-evidence
          path: /tmp/heading-preview/*
          if-no-files-found: ignore
      - name: Check position-goal planning, stalled pivots and position-only tracking
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '209'
          ROS_LOG_DIR: /tmp/arrival-ros-logs
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          cmake -S experiments/arrival -B /tmp/arrival-build
          cmake --build /tmp/arrival-build -j2
          python3 experiments/arrival/check.py --binary /tmp/arrival-build/arrival_planner --output /tmp/arrival/planner/comparison.json
          python3 experiments/arrival/check_replanning.py --binary /tmp/arrival-build/arrival_planner --output /tmp/arrival/replanning/comparison.json
          python3 experiments/arrival/check_pivot.py --binary /tmp/arrival-build/pivot_model --output /tmp/arrival/pivot/comparison.json
          python3 experiments/arrival/check_pivot_native.py --binary /tmp/arrival-build/native_pivot --output /tmp/arrival/native-pivot/report.json
          python3 experiments/arrival/check_tracking.py --binary /tmp/arrival-build/tracking_replay --output /tmp/arrival/tracking/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: position-arrival-component-evidence
          path: /tmp/arrival/*
          if-no-files-found: ignore
      - name: Preserve registered-cloud pose time under delayed sensor delivery
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source /opt/ros/humble/setup.bash
          export CYCLONEDDS_URI="file://$PWD/config/cyclonedds-local.xml"
          python3 experiments/projection/check.py --output /tmp/projection-time/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-time-evidence
          path: /tmp/projection-time
          if-no-files-found: ignore
      - name: Forward original health while non-control Console callbacks are blocked
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 ROS_DOMAIN_ID=225 ROS_LOCALHOST_ONLY=1
          python3 experiments/console_health/check.py --legacy
          python3 experiments/console_health/check.py
      - name: Keep native velocity I/O outside UI GIL stalls and preserve source expiry
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          export PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 ROS_DOMAIN_ID=224 ROS_LOCALHOST_ONLY=1
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Inavigation experiments/gait_velocity_input/contract_server.cpp -o /tmp/gait-contract-process
          python3 experiments/gait_velocity_input/check_process.py /tmp/gait-contract-process --legacy
          python3 experiments/gait_velocity_input/check_process.py /tmp/gait-contract-process
      - name: Reject missing, stale, unknown and untransformable obstacle observations
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '215'
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          python3 experiments/collision_source_guard/check.py --binary "$GITHUB_WORKSPACE/nav_controller_ws/install/p2_nav_controller/lib/p2_nav_controller/observed_collision_monitor" --output /tmp/collision-source-guard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collision-source-component-evidence
          path: /tmp/collision-source-guard*
          if-no-files-found: ignore
      - name: Preserve every long-path point and original source time across relay
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '226'
          ROS_LOG_DIR: /tmp/path-view-ros-logs
        run: |
          source /opt/ros/humble/setup.bash
          python3 experiments/check_path_view.py --output /tmp/path-view-component.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-view-component-evidence
          path: /tmp/path-view-component*
          if-no-files-found: ignore
      - name: Continuous reception, observed door shortcut, obstacle, pause and takeover
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '208'
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          export CYCLONEDDS_URI="file://$PWD/config/cyclonedds-local.xml"
          timeout 240s python3 experiments/reception/check_native.py --setup "$GITHUB_WORKSPACE/nav_controller_ws/install/setup.bash" --output /tmp/reception-native/report.json --scenario all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reception-native-evidence
          path: /tmp/reception-native
          if-no-files-found: ignore
      - name: Stop for a fully blocked corridor, recover after opening, and honor manual takeover
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '218'
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          export CYCLONEDDS_URI="file://$PWD/config/cyclonedds-local.xml"
          for scenario in transient persistent takeover; do
            timeout 150s python3 experiments/reception/check_native.py --setup "$GITHUB_WORKSPACE/nav_controller_ws/install/setup.bash" --output "/tmp/blockage-$scenario/report.json" --scenario blockage --block-case "$scenario" --port 8949 --domain 218
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockage-recovery-native-evidence
          path: /tmp/blockage-*
          if-no-files-found: ignore
      - name: Authored keepout in both costmaps, speed area, records and actual SLAM resume
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '208'
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source /opt/ros/humble/setup.bash
          source nav_controller_ws/install/setup.bash
          export CYCLONEDDS_URI="file://$PWD/config/cyclonedds-local.xml"
          timeout 240s python3 experiments/reception/check_native.py --setup "$GITHUB_WORKSPACE/nav_controller_ws/install/setup.bash" --output /tmp/reception-map-tools/report.json --scenario tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reception-map-tools-evidence
          path: /tmp/reception-map-tools
          if-no-files-found: ignore
      - run: bash experiments/continuous_forward/build.sh
      - run: bash experiments/continuous_forward/check_collision.sh

      - run: bash experiments/gait_space/build.sh
      - run: bash experiments/gait_space/check.sh

  gait-transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Inavigation experiments/gait_velocity_input/check_loop.cpp -o /tmp/gait-loop && /tmp/gait-loop
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Inavigation experiments/gait_velocity_input/contract_server.cpp -o /tmp/gait-contract
      - run: PYTHONPATH=navigation python3 experiments/gait_velocity_input/check_transport.py /tmp/gait-contract
      - name: Refresh original authority after a delayed velocity or measurement reply
        run: |
          python3 experiments/gait_velocity_input/check_rpc_cadence.py /tmp/gait-contract
          python3 experiments/gait_velocity_input/check_rpc_cadence.py /tmp/gait-contract --measured-delay-ms 65 --velocity-delay-ms 0
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Inavigation experiments/gait_velocity_input/check_peer_acl.cpp -o /tmp/check_peer_acl
      - run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/navigation" python3 experiments/gait_velocity_input/check_peer_acl.py /tmp/check_peer_acl
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread experiments/runtime_readiness/test_runtime_readiness.cpp -o /tmp/runtime-readiness && /tmp/runtime-readiness
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror experiments/runtime_readiness/test_imu_source_identity.cpp -o /tmp/source-identity && /tmp/source-identity
