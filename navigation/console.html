<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MID-360S 导航工作台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172437;font:15px system-ui,sans-serif}header{padding:22px 30px;background:#142b38;color:white;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}small{color:#a9c3d2}main{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:20px;max-width:1600px;margin:auto}.card{background:white;border:1px solid #dce3e8;border-radius:12px;padding:18px;margin-bottom:14px}h2{font-size:16px;margin:0 0 14px}label{display:block;margin:12px 0 5px;color:#586779}input,select,button{font:inherit;border:1px solid #c8d3db;border-radius:7px;padding:10px;width:100%;background:white}button{cursor:pointer;margin-top:8px;font-weight:600;color:#173e54}button.primary{background:#146d8b;color:white;border-color:#146d8b}.stop{background:#be323b;color:white;font-size:18px;border:0;padding:14px}.row{display:flex;gap:8px}.row>*{min-width:0}.tag{background:#d6f0f2;color:#174859;border-radius:20px;padding:6px 13px}#map{width:100%;height:640px;display:block;background:#e6eaee;border-radius:9px;touch-action:none}#message{padding:13px 16px;background:#edf5fa;border-radius:8px;margin:0 0 14px;min-height:48px}#guard{font-size:13px;line-height:1.6;color:#6a5862;margin-top:12px}.metrics{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;margin-top:15px;color:#627383}.metrics b{display:block;font-size:22px;color:#172437;margin-top:4px}#selection{font-size:13px;color:#586779;line-height:1.6;margin-top:12px}.legend{font-size:13px;display:flex;gap:18px;color:#66788a;margin:12px 0}button:disabled{opacity:.45;cursor:wait}@media(max-width:850px){main{grid-template-columns:1fr}#map{height:420px}header{padding:18px}.card{margin-bottom:8px}}</style>
<header><div><h1>MID-360S 导航工作台</h1><small>建图 → 保存 → 定位 → 前向导航</small></div><span class="tag" id="badge">正在连接</span></header>
<main><aside><section class="card"><h2>1 · 地图与模式</h2><label>地图名称</label><input id="name" value="office" pattern="[A-Za-z0-9_-]+"><label>已保存地图</label><select id="saved"><option value="">暂无地图</option></select><label>路径跟随方式</label><select id="controller"><option value="rpp">RPP · 稳定跟随</option><option value="mppi">MPPI · 对比试验，尚未全部通过</option></select><button onclick="start('mapping')">开始建图</button><button id="autoRoute" onclick="autoRoute()">运行仿真建图路线并保存</button><button onclick="save()">保存地图与位姿图</button><button class="primary" onclick="start('navigation')">载入地图，进入导航</button></section>
<section class="card"><h2>2 · 目标与定位</h2><div>在地图已观察的空白区域点击选点。</div><div id="selection">尚未选择目标</div><label>到达后的朝向 <span id="yawLabel">0°</span></label><input id="yaw" type="range" min="-180" max="180" value="0" oninput="yawLabel.textContent=this.value+'°'"><button class="primary" id="goal" onclick="go()">导航到选点</button><button onclick="initial()">将选点设为当前初始位置</button></section>
<section class="card"><h2>3 · 速度与停止</h2><label>前进速度上限 <b id="speedLabel">0.20 m/s</b></label><input id="speed" type="range" min="0.03" max="0.30" step="0.01" value="0.20" oninput="speedLabel.textContent=Number(this.value).toFixed(2)+' m/s'" onchange="setSpeed()"><button class="stop" onclick="stop()">停止并取消目标</button><div id="guard">等待连接状态</div></section></aside>
<section class="card"><div id="message">正在读取导航状态…</div><canvas id="map"></canvas><div class="legend"><span>● 蓝色：当前位置</span><span>━ 紫色：规划路径</span><span>＋ 橙色：目标</span><span>灰色：未知区域</span></div><div class="metrics"><div>前进指令<b id="vx">—</b></div><div>侧向指令<b id="vy">—</b></div><div>转向指令<b id="wz">—</b></div><div>定位<b id="localized">—</b></div><div>前方地面<b id="ground">—</b></div><div>地图<b id="mapSize">—</b></div></div></section></main>
<script>
let state=null,selection=null,view=null,apiMessage='';const c=document.getElementById('map'),ctx=c.getContext('2d');
async function api(path,data){try{let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Nav-Token':state?.request_token||''},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');apiMessage='';return j}catch(e){apiMessage=e.message;document.getElementById('message').textContent=e.message;throw e}}
const nameValue=()=>document.getElementById('name').value.trim();
async function start(mode){document.querySelectorAll('button:not(.stop)').forEach(b=>b.disabled=true);try{await api('start',{mode,name:mode==='navigation'?(document.getElementById('saved').value||nameValue()):nameValue(),controller:document.getElementById('controller').value});selection=null;await refresh()}finally{document.querySelectorAll('button:not(.stop)').forEach(b=>b.disabled=false)}}
async function save(){await api('save',{name:nameValue()});await refresh()}
async function autoRoute(){await api('sim_mapping_route',{name:nameValue()});await refresh()}
function target(){if(!selection)throw Error('请先在地图上选点');return {x:selection[0],y:selection[1],yaw:Number(document.getElementById('yaw').value)*Math.PI/180}}
async function go(){try{await api('goal',target());await refresh()}catch(e){apiMessage=e.message}}
async function initial(){try{await api('initialpose',target());await refresh()}catch(e){apiMessage=e.message}}
async function setSpeed(){await api('speed',{speed:Number(document.getElementById('speed').value)})}
async function stop(){await api('stop',{});await refresh()}
function screen(x,y){return [view.x+(x-view.ox)/view.res*view.s,view.y+(view.h-(y-view.oy)/view.res)*view.s]}
function draw(){c.width=Math.floor(c.clientWidth*devicePixelRatio);c.height=Math.floor(c.clientHeight*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);if(!state?.map){ctx.fillStyle='#718192';ctx.fillText('等待地图数据',24,35);view=null;return}let m=state.map,s=Math.min((w-30)/m.width,(h-30)/m.height);view={x:(w-m.width*s)/2,y:(h-m.height*s)/2,ox:m.origin[0],oy:m.origin[1],res:m.resolution,s,h:m.height};let img=document.createElement('canvas');img.width=m.width;img.height=m.height;let ictx=img.getContext('2d'),pixels=ictx.createImageData(m.width,m.height);for(let y=0;y<m.height;y++)for(let x=0;x<m.width;x++){let v=m.cells[(m.height-1-y)*m.width+x],i=(y*m.width+x)*4,col=v<0?[211,219,227]:v>60?[35,50,64]:[250,252,253];pixels.data.set([...col,255],i)}ictx.putImageData(pixels,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(img,view.x,view.y,m.width*s,m.height*s);if(state.path.length){ctx.strokeStyle='#8651d9';ctx.lineWidth=3;ctx.beginPath();state.path.forEach((p,i)=>{let [x,y]=screen(...p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}if(state.pose){let [x,y]=screen(...state.pose);ctx.save();ctx.translate(x,y);ctx.rotate(-state.pose[2]);ctx.fillStyle='#167ca7';ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-9,-8);ctx.lineTo(-5,0);ctx.lineTo(-9,8);ctx.closePath();ctx.fill();ctx.restore()}let p=selection||state.goal;if(p){let[x,y]=screen(...p);ctx.strokeStyle='#eb8b22';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke()}}
c.addEventListener('click',e=>{if(!view)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left-view.x)/view.s*view.res+view.ox,y=(view.h-(e.clientY-r.top-view.y)/view.s)*view.res+view.oy;selection=[x,y];document.getElementById('selection').textContent=`已选目标：X ${x.toFixed(2)} m，Y ${y.toFixed(2)} m`;draw()});
async function refresh(){try{let r=await fetch('/api/status'),j=await r.json();state=j;document.getElementById('autoRoute').style.display=j.simulation?'block':'none';document.getElementById('speed').min=j.minimum_speed;document.getElementById('speed').max=j.maximum_speed||.30;document.getElementById('badge').textContent=j.simulation?(j.simulation_kind==='native_dynamics'?'动力学导航仿真':'平面导航仿真'):'实机导航预演';const phaseLabels={waiting_clearance:'等待通路持续恢复',command_rejected:'已拒绝无效行走指令',braking_translation:'等待身体停稳，再转向',pivot:'原地转向',settling_yaw:'等待转向收稳，再前进',feedback_unavailable:'等待有效速度反馈'};document.getElementById('message').textContent=apiMessage||(j.message+(phaseLabels[j.gate.motion_phase]?' · '+phaseLabels[j.gate.motion_phase]:''));if(j.robot_name)document.getElementById('badge').textContent+=' · '+j.robot_name;let old=document.getElementById('saved').value;document.getElementById('saved').replaceChildren(...(j.maps.length?j.maps:['']).map(n=>new Option(n||'暂无地图',n)));if(j.maps.includes(old))document.getElementById('saved').value=old;let cmd=j.gate.command||[0,0,0];document.getElementById('vx').textContent=cmd[0].toFixed(2)+' m/s';document.getElementById('vy').textContent=cmd[1].toFixed(2)+' m/s';document.getElementById('wz').textContent=cmd[2].toFixed(2)+' rad/s';document.getElementById('localized').textContent=j.gate.localized?'已就绪':'等待';document.getElementById('ground').textContent=j.gate.ground_ok?'已观测':'观测不足';document.getElementById('ground').style.color=j.gate.ground_ok?'#21735c':'#b14d32';document.getElementById('goal').textContent=j.simulation?'导航到选点':'预演到选点的路径';document.getElementById('mapSize').textContent=j.map?`${(j.map.width*j.map.resolution).toFixed(1)} × ${(j.map.height*j.map.resolution).toFixed(1)} m`:'—';document.getElementById('guard').textContent=j.simulation?'仿真中的前进与转向；侧向速度固定为零。不会驱动机器人电机。':'当前仅作实机导航预演。机身外参、整机零位与步态执行尚需验收，不驱动电机。';draw()}catch(e){document.getElementById('message').textContent='导航服务未连接'}}
window.addEventListener('resize',draw);window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();stop()}});refresh();setInterval(refresh,500);
</script></html>
