<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MID-360S 导航工作台</title>
<script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('app-embedded');</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#172c3a;font:15px system-ui,sans-serif}button,input,select{font:inherit}button{border:1px solid #bccdd8;border-radius:8px;background:white;color:#17455d;padding:10px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#126b89;color:white;border-color:#126b89}.stop{background:#bc303e;color:white;border:0;font-weight:700;min-width:160px}header{height:66px;background:#142f3c;color:white;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:12px}header b{font-size:20px}header small{display:block;color:#b5cfdd;margin-top:3px}.badge{padding:5px 12px;border:1px solid #7195a6;border-radius:18px;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px;height:calc(100vh - 66px)}.map-panel{min-height:0;position:relative;display:flex;flex-direction:column;background:white;border-radius:12px;border:1px solid #cfdae2;overflow:hidden}#map{width:100%;height:100%;display:block;touch-action:none;background:#e2e8ed;min-height:220px}.toolbar{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:2}.toolbar button{box-shadow:0 2px 8px #19384820;min-width:42px}.legend{padding:8px 12px;color:#526b7b;font-size:12px;display:flex;gap:15px;flex-wrap:wrap}.side{overflow:auto;display:flex;flex-direction:column;gap:10px}.card{background:white;border:1px solid #cfdae2;border-radius:10px;padding:14px}h2{font-size:16px;margin:0 0 10px}.card button{width:100%;margin-top:8px}.card input,.card select{width:100%;padding:8px;border:1px solid #c6d4de;border-radius:6px}label{display:block;margin-top:10px;color:#536d7b;font-size:13px}#message{line-height:1.6;white-space:pre-line}#guard{color:#955221;font-size:13px;line-height:1.6}.metrics{font-size:12px;color:#526b7b;line-height:1.8}.metrics b{color:#173e54}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}details summary{cursor:pointer;font-weight:600}.note{font-size:12px;color:#59717e;line-height:1.5}#simControls{display:none}#simControls button{font-size:12px;padding:7px}.good{color:#1a775a}.alert{border-color:#df9e64;background:#fff8ee}@media(max-width:700px) and (orientation:portrait){header{height:auto;min-height:66px;flex-wrap:wrap;padding:10px 12px}header b{font-size:18px}.badge{display:none}main{height:auto;grid-template-columns:1fr;padding:8px}.map-panel{height:58vh}.side{overflow:visible}.stop{min-width:140px}.side .card{padding:12px}}@media(max-height:650px) and (orientation:landscape){header{height:54px;padding:6px 12px}header b{font-size:17px}header small{font-size:11px}main{height:calc(100vh - 54px);grid-template-columns:minmax(0,1fr) 260px;padding:7px;gap:7px}.card{padding:10px}.card button{padding:8px;margin-top:6px}h2{font-size:15px;margin-bottom:6px}.legend{padding:5px 8px}}

html,body{height:var(--app-height,100vh);overflow:hidden}body{display:flex;flex-direction:column}header{flex:none}main{flex:1;min-height:0;height:auto!important}.map-panel{min-height:0}#map{flex:1;min-height:0;height:0}.legend{flex:none}
.app-embedded header{display:none}.app-embedded main{padding:6px;gap:6px;grid-template-columns:minmax(0,1fr) 218px}.app-embedded .card{padding:9px}.app-embedded .card button{padding:8px;margin-top:6px}.app-embedded h2{font-size:14px;margin-bottom:6px}.app-embedded .card p.note{display:none}.app-embedded .legend{font-size:10px;padding:4px 6px;gap:8px}.app-embedded .toolbar{left:8px;top:8px;gap:4px}.app-embedded .toolbar button{padding:8px 10px}.app-embedded label{margin-top:6px}.app-embedded #guard{font-size:11px;line-height:1.4}.app-embedded #message{font-size:12px;line-height:1.4}
@media(max-width:700px) and (orientation:portrait){html,body{height:auto;overflow:auto}main{flex:none}.map-panel{height:58vh;min-height:220px}#map{height:auto}.app-embedded main{grid-template-columns:1fr}}
</style>
<header><div><b>MID-360S 导航工作台</b><small id="authority">等待 E 开关状态</small></div><span id="badge" class="badge">连接中</span><button class="stop" onclick="stop()">取消 / 停止导航</button></header>
<main><section class="map-panel"><div class="toolbar"><button onclick="zoomAt(1.4)">＋</button><button onclick="zoomAt(1/1.4)">−</button><button onclick="fit()">全图</button><button onclick="follow()">当前位置</button></div><canvas id="map" aria-label="实时地图，可拖动、缩放和点击选点"></canvas><div class="legend"><span>● 蓝：当前位置</span><span>━ 紫：路径</span><span>＋ 橙：目标</span><span>灰：未知区域</span></div></section>
<aside class="side"><section class="card" id="stateCard"><h2>导航状态</h2><div id="message" role="status" aria-live="polite">正在连接…</div><div id="guard"></div><div id="simControls" class="row"><button onclick="simMode('navigation_allowed')">仿真 E 左</button><button onclick="simMode('paused')">中</button><button onclick="simMode('manual')">右</button></div></section>
<section class="card"><h2>目的地</h2><div id="selection" class="note">在已观察的空白区域点选；拖动可平移，双指可缩放。</div><label>到达朝向 <span id="yawLabel">0°</span></label><input id="yaw" type="range" min="-180" max="180" value="0" oninput="yawLabel.textContent=this.value+'°';invalidate()"><button class="primary" id="preview" onclick="prepare()">1 · 预览路径</button><button class="primary" id="confirm" onclick="confirmStart()" disabled>2 · 确认开始</button><button onclick="initial()">将选点设为当前初始位置</button><p class="note">E 左档只允许导航；E 右档或摇杆介入会撤销目标。切回左档、摇杆归中均不会自动续走。</p></section>
<section class="card"><div class="row"><button id="halfSpeed" onclick="setVelocityScale(0.5)">0.5倍速</button><button id="fullSpeed" onclick="setVelocityScale(1)">1倍速</button></div><label>当前倍率 <b id="scaleLabel">—</b></label><label>前进上限 <b id="speedLabel">—</b></label><input id="speed" type="range" min="0.03" max="0.15" step="0.01" value="0.15" oninput="speedLabel.textContent=(Number(this.value)*(state?.gate?.velocity_scale??state?.velocity_scale??1)).toFixed(3)+' m/s'" onchange="setSpeed()"><div class="metrics">前进 <b id="vx">—</b> · 侧向 <b id="vy">—</b><br>转向 <b id="wz">—</b><br>定位 <b id="localized">—</b> · 前方地面 <b id="ground">—</b><br>地图 <b id="mapSize">—</b></div></section>
<details class="card"><summary>地图与模式</summary><label>地图名称</label><input id="name" value="office" pattern="[A-Za-z0-9_-]+"><label>已保存地图</label><select id="saved"></select><label>路径跟随</label><select id="controller"><option value="rpp">RPP · 稳定跟随</option><option value="mppi">MPPI · 对比试验</option></select><button onclick="start('mapping')">开始建图</button><button id="autoRoute" onclick="autoRoute()">仿真建图路线并保存</button><button onclick="save()">保存地图与位姿图</button><button onclick="start('navigation')">载入地图，进入导航</button></details></aside></main>
<script>
const API_BASE=location.pathname.startsWith('/api/v1/modules/navigation/workbench')?'/api/v1/modules/navigation/proxy':'';
const c=document.getElementById('map'),ctx=c.getContext('2d'),byId=id=>document.getElementById(id);
let state=null,mapData=null,mapImage=null,mapRevision=null,selection=null,view=null,zoom=1,pan=[0,0],prepared=null,selectionVersion=0,apiMessage='',refreshing=false,lastNotice=0;
const pointers=new Map();let dragStart=null,previousPoint=null,pinched=false,lastPinch=null;
async function get(path){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),4000);try{let r=await fetch(API_BASE+path,{signal:controller.signal});if(!r.ok)throw Error('导航服务连接失败');return await r.json()}finally{clearTimeout(timer)}}
async function api(path,data){let r=await fetch(API_BASE+'/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Nav-Token':state?.request_token||''},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}
function showError(e){apiMessage=e.message;byId('message').textContent=apiMessage}
function invalidate(){prepared=null;selectionVersion++;byId('confirm').disabled=true}
function target(){if(!selection)throw Error('请先在地图上选点');return {x:selection[0],y:selection[1],yaw:Number(byId('yaw').value)*Math.PI/180}}
async function prepare(){let version=selectionVersion;prepared=null;byId('preview').disabled=true;try{let j=await api('goal',target());if(version!==selectionVersion){await api('stop',{});return}prepared=j.generation;apiMessage='';await refresh()}catch(e){showError(e)}finally{byId('preview').disabled=false}}
async function confirmStart(){let generation=prepared;if(!generation)return;byId('confirm').disabled=true;try{await api('confirm',{generation});apiMessage='';await refresh()}catch(e){showError(e)}}
async function stop(){invalidate();apiMessage='正在提交取消与停车请求…';byId('message').textContent=apiMessage;try{await api('stop',{});apiMessage='';await refresh()}catch(e){showError(e)}}
async function initial(){try{await api('initialpose',target());apiMessage='';await refresh()}catch(e){showError(e)}}
async function setVelocityScale(scale){try{await api('speed',{speed:Number(byId('speed').value),velocity_scale:scale});apiMessage='';await refresh()}catch(e){showError(e)}}
async function setSpeed(){try{await api('speed',{speed:Number(byId('speed').value)});apiMessage=''}catch(e){showError(e)}}
async function simMode(mode){try{await api('sim_operator',{mode});apiMessage='';await refresh()}catch(e){showError(e)}}
const nameValue=()=>byId('name').value.trim();
async function start(mode){try{await api('start',{mode,name:mode==='navigation'?(byId('saved').value||nameValue()):nameValue(),controller:byId('controller').value});invalidate();selection=null;mapRevision=null;apiMessage='';await refresh()}catch(e){showError(e)}}
async function save(){try{await api('save',{name:nameValue()});apiMessage='';await refresh()}catch(e){showError(e)}}
async function autoRoute(){try{await api('sim_mapping_route',{name:nameValue()});apiMessage='';await refresh()}catch(e){showError(e)}}
function fit(){zoom=1;pan=[0,0];draw()}
function zoomAt(factor,x=c.clientWidth/2,y=c.clientHeight/2){let old=zoom;zoom=Math.min(12,Math.max(1,zoom*factor));let a=zoom/old;pan=[x-c.clientWidth/2-a*(x-c.clientWidth/2-pan[0]),y-c.clientHeight/2-a*(y-c.clientHeight/2-pan[1])];draw()}
function screen(x,y){return [view.x+(x-view.ox)/view.res*view.s,view.y+(view.h-(y-view.oy)/view.res)*view.s]}
function follow(){if(!state?.pose||!view)return;let [x,y]=screen(...state.pose);pan[0]+=c.clientWidth/2-x;pan[1]+=c.clientHeight/2-y;draw()}
function cacheMap(m){mapData=m;if(!m){mapImage=null;return}mapImage=document.createElement('canvas');mapImage.width=m.width;mapImage.height=m.height;let ictx=mapImage.getContext('2d'),pixels=ictx.createImageData(m.width,m.height);for(let y=0;y<m.height;y++)for(let x=0;x<m.width;x++){let v=m.cells[(m.height-1-y)*m.width+x],i=(y*m.width+x)*4;pixels.data.set(v<0?[198,210,220,255]:v>60?[35,50,64,255]:[250,252,253,255],i)}ictx.putImageData(pixels,0,0)}
function draw(){let w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio;c.width=Math.max(1,Math.floor(w*d));c.height=Math.max(1,Math.floor(h*d));ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);if(!mapData||!mapImage){view=null;ctx.fillStyle='#59717e';ctx.fillText('等待地图数据',24,70);return}let m=mapData,s=Math.min((w-26)/m.width,(h-26)/m.height)*zoom;view={x:(w-m.width*s)/2+pan[0],y:(h-m.height*s)/2+pan[1],ox:m.origin[0],oy:m.origin[1],res:m.resolution,s,h:m.height};ctx.imageSmoothingEnabled=false;ctx.drawImage(mapImage,view.x,view.y,m.width*s,m.height*s);let path=state?.path||[];if(path.length){ctx.strokeStyle='#8551cf';ctx.lineWidth=3;ctx.beginPath();path.forEach((p,i)=>{let[x,y]=screen(...p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}if(state?.pose){let[x,y]=screen(...state.pose);ctx.save();ctx.translate(x,y);ctx.rotate(-state.pose[2]);ctx.fillStyle='#087fa9';ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-9,-8);ctx.lineTo(-5,0);ctx.lineTo(-9,8);ctx.closePath();ctx.fill();ctx.restore()}let p=selection||state?.goal;if(p){let[x,y]=screen(...p);ctx.strokeStyle='#e28618';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke()}}
function localPoint(e){let r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
c.addEventListener('wheel',e=>{e.preventDefault();let[x,y]=localPoint(e);zoomAt(e.deltaY<0?1.18:1/1.18,x,y)},{passive:false});
c.addEventListener('pointerdown',e=>{let p=localPoint(e);pointers.set(e.pointerId,p);c.setPointerCapture(e.pointerId);if(pointers.size===1){dragStart=p;previousPoint=p;pinched=false}if(pointers.size===2){pinched=true;let a=[...pointers.values()];lastPinch=Math.hypot(a[1][0]-a[0][0],a[1][1]-a[0][1])}});
c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=localPoint(e);pointers.set(e.pointerId,p);if(pointers.size===2){let a=[...pointers.values()],distance=Math.hypot(a[1][0]-a[0][0],a[1][1]-a[0][1]);if(lastPinch>0)zoomAt(distance/lastPinch,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);lastPinch=distance}else if(previousPoint){pan[0]+=p[0]-previousPoint[0];pan[1]+=p[1]-previousPoint[1];previousPoint=p;draw()}});
function release(e,cancelled=false){let p=localPoint(e);if(!cancelled&&!pinched&&pointers.size===1&&dragStart&&Math.hypot(p[0]-dragStart[0],p[1]-dragStart[1])<5&&view){selection=[(p[0]-view.x)/view.s*view.res+view.ox,(view.h-(p[1]-view.y)/view.s)*view.res+view.oy];invalidate();byId('selection').textContent=`X ${selection[0].toFixed(2)} m，Y ${selection[1].toFixed(2)} m`;draw()}pointers.delete(e.pointerId);previousPoint=pointers.size===1?[...pointers.values()][0]:null;if(!pointers.size){dragStart=null;lastPinch=null}}
c.addEventListener('pointerup',e=>release(e));c.addEventListener('pointercancel',e=>release(e,true));
async function refresh(){if(refreshing)return;refreshing=true;try{let j=await get('/api/status?summary=1');state=j;if(j.map_revision!==mapRevision||(!mapData&&j.map)){let d=await get('/api/map');cacheMap(d.map);mapRevision=d.revision}if(!j.map)cacheMap(null);let s=j.session||{},g=j.gate||{},modes={navigation_allowed:'E 左档 · 导航允许',manual:'E 右档 · 手动控制',paused:'E 中档 · 暂停',unknown:'E 档位待核验'};byId('authority').textContent=modes[s.operator_mode]||modes.unknown;byId('badge').textContent=(j.simulation?'导航仿真':'实机路径预演')+(j.robot_name?' · '+j.robot_name:'');byId('message').textContent=apiMessage||s.notice||j.message;byId('stateCard').classList.toggle('alert',['blocked','stopped'].includes(s.phase));byId('guard').textContent=j.simulation?'仿真 E 左档后可确认开始；不会驱动真实机器人。':!g.ground_ok?'前方地面观测不足；步态接管尚未完成，当前只可预演。':'步态接管和保护开关联调尚未完成，当前只可预演。';byId('confirm').disabled=!(prepared&&prepared===s.generation&&s.phase==='ready'&&s.navigation_permitted&&j.simulation&&g.ground_ok&&g.localized);if(['manual','paused','cancelled','stopped','blocked'].includes(s.phase))prepared=null;byId('simControls').style.display=j.simulation?'flex':'none';byId('autoRoute').style.display=j.simulation?'block':'none';let old=byId('saved').value;byId('saved').replaceChildren(...(j.maps.length?j.maps:['']).map(n=>new Option(n||'暂无地图',n)));if(j.maps.includes(old))byId('saved').value=old;let scale=g.velocity_scale??j.velocity_scale??1;byId('scaleLabel').textContent=scale.toFixed(1)+'倍（前进 / 横向 / 转向）';byId('halfSpeed').classList.toggle('primary',scale===0.5);byId('fullSpeed').classList.toggle('primary',scale===1);let v=byId('speed');v.min=j.minimum_speed;v.max=j.maximum_speed||.15;if(document.activeElement!==v){v.value=g.speed_cap||Math.min(Number(v.value),j.maximum_speed||.15);byId('speedLabel').textContent=(Number(v.value)*scale).toFixed(3)+' m/s'}let cmd=g.command||[0,0,0];byId('vx').textContent=cmd[0].toFixed(2)+' m/s';byId('vy').textContent=cmd[1].toFixed(2)+' m/s';byId('wz').textContent=cmd[2].toFixed(2)+' rad/s';byId('localized').textContent=g.localized?'已就绪':'等待';byId('ground').textContent=g.ground_ok?'已观测':'不足';byId('mapSize').textContent=j.map?`${(j.map.width*j.map.resolution).toFixed(1)} × ${(j.map.height*j.map.resolution).toFixed(1)} m`:'—';if(s.notice_sequence!==lastNotice){lastNotice=s.notice_sequence;if(s.phase==='blocked'&&navigator.vibrate)navigator.vibrate([100,80,100])}draw()}catch(e){byId('authority').textContent='导航状态连接中断';byId('message').textContent='导航服务未连接；请用 E 右档手动接管';byId('confirm').disabled=true}finally{refreshing=false}}
window.addEventListener('resize',draw);window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){e.preventDefault();stop()}});refresh();setInterval(refresh,250);
</script></html>
