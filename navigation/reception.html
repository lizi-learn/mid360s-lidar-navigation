</style></head><body><div class="shell"><aside class="rail"><div><div class="brand">迎 · 导览</div><div class="brand-sub">RECEPTION STUDIO</div></div><button class="nav-btn active" data-tab="points"><span class="nav-icon">⌖</span>地图编排</button><button class="nav-btn" data-tab="routes"><span class="nav-icon">⇢</span>展示路线</button><button class="nav-btn" data-tab="products"><span class="nav-icon">▤</span>产品讲解</button><button class="nav-btn" data-tab="policy"><span class="nav-icon">◷</span>通行决策</button><button class="nav-btn" data-tab="maps"><span class="nav-icon">▧</span>地图工具与备份</button><button class="nav-btn" data-tab="replay"><span class="nav-icon">▷</span>轨迹回放</button><button class="nav-btn" data-tab="history"><span class="nav-icon">≡</span>运行记录</button><div class="rail-foot">BASELINE V1 · 扩展开发版<br>场地内容保存在本机<br><button class="nav-btn" onclick="returnToNavigation()">← 原导航地图</button></div></aside><div class="workspace"><header class="topbar row spread"><div><div class="eyebrow">RECEPTION / WORKSPACE</div><div class="row"><b id="placeTitle">导览接待</b><span class="chip" id="revisionBadge">未载入</span></div></div><div class="row"><select id="mapSelect" aria-label="编辑地图"></select><div class="segment"><button id="adminMode" class="selected" onclick="switchMode(false)">管理</button><button id="operatorMode" onclick="switchMode(true)">执行</button></div></div></header><main class="content"><div class="heading"><div><h2 id="pageTitle">把每一个目的地，变成一次好介绍</h2><p class="description" id="pageDescription">在地图上放置点位，设置到达朝向与介绍内容。路线和点位可随时复用。</p></div><div class="row admin-only"><button onclick="exportContent()">导出</button><button onclick="document.getElementById('importFile').click()">导入</button><button class="primary" id="addButton" onclick="addItem()">＋ 新建点位</button></div></div><div id="mapBoard" class="board"><section class="map-card"><div class="map-header"><b id="mapLabel">场地地图</b><span id="mapHint" class="muted small grow">点击选点 · 滚轮缩放 · 拖动空白平移</span><div class="segment"><button id="view2d" class="selected" onclick="setView('2d')">2D</button><button id="view3d" onclick="setView('3d')">3D</button></div></div><div class="map-wrap"><canvas id="mapCanvas" aria-label="场地点位与路线地图"></canvas><div class="map-tools"><button onclick="scaleMap(1.3)" aria-label="放大">＋</button><button onclick="scaleMap(1/1.3)" aria-label="缩小">−</button><button onclick="fitMap()" aria-label="适应地图">⌗</button><button class="admin-only" onclick="importCloud()" title="导入三维点云">⋮</button></div><div class="map-stamp" id="mapStamp">坐标单位 m · 三维点云独立加载</div></div><div class="legend"><span><i class="dot"></i>讲解点</span><span><i class="dot gold"></i>指定朝向</span><span><i class="dot gray"></i>途经点</span><span id="cloudInfo"></span></div></section><aside class="inspector"><div id="inspector"></div></aside></div><div id="tableView" class="table-view hidden"></div><div id="pointCards" class="cards"></div><div class="footer-bar"><span class="status-led" id="statusLed"></span><div class="grow"><b id="taskStatus" class="small">连接导航服务…</b><div id="taskDetail" class="muted small">不会自动开始任务</div></div><button id="cancelAll" class="danger" onclick="stopAll()">取消导航</button><button class="quiet admin-only" onclick="saveAll()" id="saveButton">保存更改</button></div></main></div></div><div id="toast" role="status"></div><input type="file" id="importFile" accept="application/json" hidden><input type="file" id="cloudFile" accept="application/json" hidden>
<script>
'use strict';
const API_BASE=location.pathname.startsWith('/api/v1/modules/navigation/')?'/api/v1/modules/navigation/proxy':'';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null,doc=null,voice=null,tab='points',selected=null,selectedRoute=null,dirty=false,operator=false,map=null,mapRevision=-1,img=null,zoom=1,pan=[0,0],viewMode='2d',cloud=[],cloudFrame='',cloudYaw=-.65,cloudPitch=.7,view=null,loading=false,pointer=null,toastTimer=null,selectedProduct=null,refreshBusy=false,serverBoot=null,lastOperatorRender=null,runKind="point",mapEdit=null,historyData=null,historyBusy=false,historyAt=0,contentVersions=null,cloudRaster=null,temporaryTarget=null,missionPending=false,draftSequence=0,savePending=false;
const canvas=$('mapCanvas'),ctx=canvas.getContext('2d');
async function request(path,data){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),data?.reception?.operation?.startsWith('map_')?90000:15000);try{const r=await fetch(API_BASE+path,{method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json','X-Nav-Token':state?.request_token||''},body:data===undefined?undefined:JSON.stringify(data),signal:controller.signal});let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}finally{clearTimeout(timer)}}
function returnToNavigation(){location.href=API_BASE?location.pathname+'?embedded=1':'/';}
function operatorInstruction(){const s=state?.session;return !s?.operator_verified?'正在连接 E 档位':s.operator_mode==='manual'?'E 右档 · 手动控制，切左档后可开始':s.operator_mode==='paused'?'E 中档 · 已暂停，回左档后点继续':s.manual_activity?'摇杆已接管，请重新开始任务':s.operator_mode==='navigation_allowed'?'E 左档允许导航；右档或摇杆立即接管':'当前档位未允许导航';}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4500)}
function touch(){draftSequence++;dirty=true;$('saveButton').textContent='保存更改 · 未保存';$('revisionBadge').textContent='草稿 · v'+doc.revision}
function uid(prefix){return prefix+'_'+crypto.getRandomValues(new Uint32Array(2)).join('_')}
function switchMode(value){mapEdit=null;canvas.style.cursor='';operator=value;document.body.classList.toggle('operator',value);$('adminMode').classList.toggle('selected',!value);$('operatorMode').classList.toggle('selected',value);if(value)tab='routes';render();requestAnimationFrame(draw)}
async function loadCatalog(mapId){loading=true;try{const r=await request('/api/save',{reception:{operation:'read',map_id:mapId}});doc=r.document;voice=r.voice;selected=doc.points[0]?.id||null;selectedRoute=doc.routes[0]?.id||null;selectedProduct=doc.products[0]?.id||null;dirty=false;$('saveButton').textContent='保存更改';$('revisionBadge').textContent='已保存 · v'+doc.revision;$('mapSelect').value=doc.map_id;render()}catch(e){toast(e.message)}finally{loading=false}}
async function saveDocument(value,kind,revision){
if(API_BASE&&new TextEncoder().encode(JSON.stringify(value)).length>6500){const bytes=new TextEncoder().encode(JSON.stringify(value)),total=Math.ceil(bytes.length/4096),upload_id=uid('upload');let result;for(let index=0;index<total;index++){const chunk=btoa(String.fromCharCode(...bytes.slice(index*4096,(index+1)*4096)));result=await request('/api/save',{reception:{operation:'stage',upload_id,map_id:doc.map_id,kind,revision,index,total,chunk}})}if(!result.committed)throw Error('内容传输尚未完成');return result.value}
return request('/api/save',{reception:kind==='catalog'?{operation:'save',document:value,expected_revision:revision}:{operation:'cloud_save',cloud:value}})
}
function syncEditorDraft(){
if(!doc||operator)return;
if($('pName')){const p=doc.points.find(p=>p.id===($('inspector').dataset.pointId||selected));if(p)applyPoint(p)}
if($('rName')){const r=doc.routes.find(r=>r.id===selectedRoute);if(r){r.name=$('rName').value;r.mode=$('rMode').value;r.loops=Number($('rLoops').value);r.description=$('rDesc').value;touch()}}
if($('productName')){const p=doc.products.find(p=>p.id===selectedProduct);if(p){p.name=$('productName').value;p.script=$('productScript').value;p.tags=$('productTags').value;touch()}}
}
async function saveAll(){
if(!doc)return false;if(savePending){toast('正在保存，请稍候');return false}
syncEditorDraft();
const missing=doc.points.findIndex(p=>typeof p.name!=='string'||!p.name.trim());
if(missing>=0){selected=doc.points[missing].id;tab='points';if(typeof studioPanel!=='undefined')studioPanel='point';render();$('pName')?.setAttribute('aria-invalid','true');$('pName')?.focus();toast('第'+(missing+1)+'个点位名称不能为空，请在右侧填写');return false}
const sequence=draftSequence,mapId=doc.map_id,snapshot=JSON.parse(JSON.stringify(doc));savePending=true;
try{const r=await saveDocument(snapshot,'catalog',snapshot.revision);
if(doc.map_id!==mapId)return true;
if(draftSequence!==sequence){doc.revision=r.revision;dirty=true;$('revisionBadge').textContent='草稿 · v'+r.revision;toast('本次内容已保存；保存期间的新修改仍在草稿中');return false}
doc=r;dirty=false;$('saveButton').textContent='保存更改';$('revisionBadge').textContent='已保存 · v'+doc.revision;toast('点位、路线和讲解已保存');render();return true

canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect(),p=[e.clientX-r.left,e.clientY-r.top];let hit=null;if(viewMode==='2d'&&!mapEdit){const hits=(doc?.points||[]).filter(q=>{let xy=screen(q.x,q.y);return Math.hypot(xy[0]-p[0],xy[1]-p[1])<18});hit=hits[(hits.findIndex(q=>q.id===selected)+1)%Math.max(1,hits.length)];}pointer={x:p[0],y:p[1],start:p,moved:false,hit:hit?.id,dragPoint:hit&&!operator&&tab==='points'};if(hit){temporaryTarget=null;selected=hit.id;if(operator)runKind='point';if(!operator&&tab==='routes')appendStep(hit.id);else{renderInspector();renderCards();draw()}}};
canvas.onpointermove=e=>{if(!pointer)return;const r=canvas.getBoundingClientRect(),p=[e.clientX-r.left,e.clientY-r.top],dx=p[0]-pointer.x,dy=p[1]-pointer.y;if(Math.hypot(p[0]-pointer.start[0],p[1]-pointer.start[1])>4)pointer.moved=true;if(pointer.moved){if(viewMode==='3d'){cloudYaw+=dx*.008;cloudPitch=Math.min(1.5,Math.max(.15,cloudPitch+dy*.005))}else if(pointer.dragPoint){let q=doc.points.find(q=>q.id===pointer.hit);const xy=world(...p);q.x=+xy[0].toFixed(2);q.y=+xy[1].toFixed(2);touch()}else{pan[0]+=dx;pan[1]+=dy}draw()}pointer.x=p[0];pointer.y=p[1]};
canvas.onpointerup=()=>{if(operator&&viewMode==='2d'&&pointer&&!pointer.moved&&!pointer.hit){const xy=world(pointer.x,pointer.y);temporaryTarget={x:+xy[0].toFixed(3),y:+xy[1].toFixed(3)};selected=null;selectedDock=null;runKind='point';renderInspector();draw();}if(pointer&&!pointer.moved&&mapEdit){const p=doc.points.find(p=>p.id===selected),xy=world(pointer.x,pointer.y);if(p){if(mapEdit==='position'){p.x=+xy[0].toFixed(2);p.y=+xy[1].toFixed(2)}else p.yaw=Math.atan2(xy[1]-p.y,xy[0]-p.x);touch();renderInspector();renderCards();draw()}mapEdit=null;canvas.style.cursor='';$('mapHint').textContent='点击选点 · 滚轮缩放 · 拖动空白平移'}if(pointer?.dragPoint&&pointer.moved){renderInspector();renderCards()}pointer=null};canvas.onpointercancel=()=>pointer=null;canvas.onwheel=e=>{e.preventDefault();scaleMap(e.deltaY<0?1.12:1/1.12)};new ResizeObserver(draw).observe(canvas);
/*RECEPTION_TOOLS*/
$('mapSelect').onchange=e=>{if(dirty){e.target.value=doc.map_id;toast('有未保存的更改，请先保存或重新载入');return}loadCatalog(e.target.value)};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});function keepDraft(e){if(!doc||operator)return;const id=e.target.id;if(['pName','pX','pY','pKind','fixedYaw','pYaw','pProduct','pScript','pDwell','pWait'].includes(id)){const p=doc.points.find(p=>p.id===($('inspector').dataset.pointId||selected));if(p)applyPoint(p)}else if(['productName','productScript','productTags'].includes(id)){const p=doc.products.find(p=>p.id===selectedProduct);if(p){p.name=$('productName').value;p.script=$('productScript').value;p.tags=$('productTags').value;touch()}}else if(['rName','rMode','rLoops','rDesc'].includes(id)){const r=doc.routes.find(r=>r.id===selectedRoute);if(r){r.name=$('rName').value;r.mode=$('rMode').value;r.loops=+$('rLoops').value;r.description=$('rDesc').value;touch()}}};document.addEventListener('input',keepDraft);document.addEventListener('change',keepDraft);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});if(new URLSearchParams(location.search).get('native_shell')==='1')document.body.classList.add('handheld-native');if(new URLSearchParams(location.search).get('view')==='operator'||new URLSearchParams(location.search).get('embedded')==='1')switchMode(true);refresh();setInterval(()=>{if(!document.hidden)refresh()},1000);
</script></body></html>
