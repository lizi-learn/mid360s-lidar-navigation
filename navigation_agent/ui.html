<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P2 · 导览助手</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#173b3c;background:#f2f6f5}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dce7e4;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:22px;margin:0}.sub{color:#617976;font-size:13px}a{color:#087f7c}main{max-width:1160px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.panel{background:white;border:1px solid #dce7e4;border-radius:16px;padding:22px;box-shadow:0 6px 22px #244d4510}h2{font-size:16px;margin:0 0 12px}#messages{height:51vh;min-height:260px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 0 18px}.bubble{padding:12px 16px;border-radius:14px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f5f4}.user{align-self:flex-end;background:#e0f2ee}.assistant{align-self:flex-start}.system{color:#637a75;font-size:14px;background:transparent}textarea{width:100%;resize:vertical;min-height:82px;border:1px solid #b8cfca;border-radius:10px;padding:12px;font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:#087f7c;color:white;font:inherit;padding:10px 18px}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.stop{background:#a84135}#mode{padding:6px 12px;border-radius:20px;background:#edf3f1;font-size:14px}.row{border-bottom:1px solid #edf2f0;padding:12px 0}.label{font-size:13px;color:#617976}.value{font-size:16px}.example{display:block;width:100%;text-align:left;margin:10px 0;background:#edf5f2;color:#245c52;font-size:14px}.error{color:#a84135}details{margin-top:12px}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#526b66}footer{color:#6b817c;font-size:12px;margin-top:16px}@media(max-width:760px){main{grid-template-columns:1fr;margin:14px auto}.panel{padding:16px}header{padding:14px 18px}#messages{height:44vh}aside{order:-1}.row{display:inline-block;width:49%;vertical-align:top}}
</style>
<header><div><h1>导览助手</h1><div class="sub">RAI · <span id="model">DeepSeek Pro</span></div></div><div id="mode">正在连接机器人</div><a href="/reception">返回地图</a></header>
<main><section class="panel"><div id="messages" aria-live="polite"></div><form id="form"><label for="text" class="sub">用一句话安排导航或查询任务</label><textarea id="text" placeholder="例如：去点位2；按20到1的路线参观；看看现在到哪了" maxlength="2000"></textarea><div class="actions"><button type="button" class="stop" id="stop">停止导航</button><button id="send">发送指令</button></div></form><details><summary class="sub">本次工具回执</summary><pre id="receipts">等待指令</pre></details></section>
<aside class="panel"><h2>机器人当前状态</h2><div class="row"><div class="label">机器人</div><div class="value" id="robot">—</div></div><div class="row"><div class="label">当前执行状态</div><div class="value" id="phase">—</div></div><div class="row"><div class="label">本会话最近任务</div><div class="value" id="progress">—</div></div><div class="row"><div class="label">状态说明</div><div class="value" id="notice">—</div></div><h2 style="margin-top:22px">试着这样说</h2><button class="example">有哪些点位和路线？</button><button class="example">去点位2</button><button class="example">按20到1的路线参观</button><button class="example">查询当前导航进度</button><footer>明确发出前往指令后会启动导航，无需再次确认。E右档或摇杆操作仍可接管；停止按钮直接请求导航停车，不等待大模型。</footer></aside></main>
<script>
function newRequestId(){const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const h=Array.from(bytes,v=>v.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);}
const $=id=>document.getElementById(id);let token='',busy=false;const taskBubbles=new Map();const conversation=localStorage.p2AgentConversation||(localStorage.p2AgentConversation=newRequestId());
function showReply(node,text){node.replaceChildren();for(const part of text.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/g)){if(part.startsWith('**')&&part.endsWith('**')){const n=document.createElement('strong');n.textContent=part.slice(2,-2);node.append(n)}else if(part.startsWith('`')&&part.endsWith('`')){const n=document.createElement('code');n.textContent=part.slice(1,-1);node.append(n)}else node.append(document.createTextNode(part))}}
function bubble(text,kind='assistant'){const n=document.createElement('div');n.className='bubble '+kind;n.textContent=text;$('messages').append(n);$('messages').scrollTop=$('messages').scrollHeight;return n}
async function api(path,data){const r=await fetch('/api/agent/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-Agent-Token':token}:{},body:data?JSON.stringify(data):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'未收到服务回执');return d}
const phases={idle:'待命',accepted:'已受理',running:'导航中',blocked:'等待绕行',paused:'已暂停',presenting:'正在讲解',dwelling:'正在停留',waiting:'等待继续',succeeded:'已完成',failed:'未完成',cancelled:'已取消',interrupted:'已接管',unknown:'状态待查询'};
function statusView(d){const s=d.navigation,t=d.task;return {phase:s.task_active===false?'待命':phases[s.navigation_state]||s.navigation_state||'—',progress:t?(phases[t.state]||t.state)+(t.observation?.station_total?' · '+Math.min(t.observation.station_index+1,t.observation.station_total)+'/'+t.observation.station_total:''):'尚无本会话任务'}}
function taskReply(t){if(!t)return null;const reason=t.observation?.reason||t.error?.message||(typeof t.error==='string'?t.error:'');if(t.state==='succeeded')return '导航任务已完成。';if(t.state==='failed')return '导航未完成。'+(reason||'请查看实际导航回执。');if(t.state==='cancelled')return '导航任务已取消。';if(t.state==='interrupted')return '导航任务已被手动接管。';if(t.state==='paused')return '导航已暂停，等待继续。';if(t.state==='unknown'||t.observation_stale)return '暂时无法确认导航执行状态，未自动重发。';if(t.state==='blocked')return '导航正在等待通路。'+reason;if(t.state==='running')return '导航任务执行中，尚未完成。';return null}
async function refresh(){try{const d=await api('status?conversation='+encodeURIComponent(conversation)),s=d.navigation;$('robot').textContent=s.robot_id||s.backend;$('mode').textContent=s.operator_mode==='navigation_allowed'?'E左 · 导航允许':s.operator_mode==='paused'?'E中 · 暂停':s.operator_mode==='manual'?'E右 · 手动优先':'正在读取E档位';const view=statusView(d);$('phase').textContent=view.phase;$('notice').textContent=s.notice||'—';const t=d.task;$('progress').textContent=view.progress;const reply=taskReply(t);if(reply&&taskBubbles.has(t.id))showReply(taskBubbles.get(t.id),reply);$('mode').classList.remove('error')}catch(e){$('mode').textContent='连接暂时中断';$('mode').classList.add('error')}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy||!token||!$('text').value.trim())return;const text=$('text').value.trim();bubble(text,'user');$('text').value='';const answer=bubble('正在理解并查询真实状态…','system');busy=true;$('send').disabled=true;const id=newRequestId();try{let d=await api('chat',{id,conversation,text});while(['queued','working'].includes(d.state)){await new Promise(r=>setTimeout(r,700));d=await api('jobs/'+id)}answer.className='bubble assistant';showReply(answer,d.reply||'请求已处理');if(d.task?.id)taskBubbles.set(d.task.id,answer);$('receipts').textContent=JSON.stringify({state:d.state,task:d.task,tools:d.tools},null,2)}catch(e){answer.textContent=e.message+'。未自动重发，请先查询状态。'}finally{busy=false;$('send').disabled=false;$('messages').scrollTop=$('messages').scrollHeight;refresh()}};
$('stop').onclick=async()=>{try{await api('stop',{});bubble('已请求停止导航，待处理的旧指令也已撤销。');refresh()}catch(e){bubble(e.message,'system')}};
document.querySelectorAll('.example').forEach(n=>n.onclick=()=>{$('text').value=n.textContent;$('text').focus()});
(async()=>{try{const d=await api('meta');token=d.request_token;$('model').textContent=d.model;refresh();setInterval(refresh,2500);bubble('你好，可以让我前往已保存点位、执行参观路线，或查询当前任务。')}catch(e){bubble(e.message,'system')}})();
</script></html>
