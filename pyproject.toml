[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-navigation-sdk"
version = "0.1.0"
description = "Unified navigation client and documented WATER protocol bridge"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "docs/sdk/README.md"
dependencies = []

[project.scripts]
navbridge = "navigation_sdk.gateway:main"
p2-nav-agent = "navigation_agent.server:main"

[tool.setuptools]
packages = ["navigation_sdk", "navigation_agent"]

[tool.setuptools.package-data]
navigation_agent = ["ui.html"]
